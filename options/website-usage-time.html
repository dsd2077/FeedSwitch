<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      http-equiv="Content-Type"
      content="text/html; charset=UTF-8"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>网站使用时间</title>
    <script
      src="../node_modules/chart.js/dist/chart.umd.js"
      defer
    ></script>
    <link
      href="./website-usage-time.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <h2>网页使用时间</h2>
    <div class="chart-container">
      <!-- Weekly Data Section -->
      <div class="weeklyData">
        <div class="info-chart">
          <div class="info-section">
            <div class="info-item">
              <span>时间范围</span>
              <div>
                <button id="prevWeek">‹</button>
                <span id="weeklyDateRange">04/23 - 04/29</span>
                <button id="nextWeek">›</button>
              </div>
            </div>

            <div class="info-item">
              <span>总时长</span>
              <span id="weeklyTotalDuration">18h 43m 1s</span>
            </div>
            <div class="info-item">
              <span>平均时长</span>
              <span id="weeklyAverageDuration">2h 40m 25s</span>
            </div>
          </div>
          <div class="chart-wrapper">
            <canvas id="weeklyChart"></canvas>
          </div>
        </div>
        <div id="weekly-website-list" class="website-list"> </div>
      </div>

      <!-- Daily Data Section -->
      <div class="dailyData">
        <div class="info-chart">
          <div class="info-section">
            <div class="info-item">
              <span>日期</span>
              <div>
                <button id="prevDay">‹</button>
                <span id="dailyDate">04/29</span>
                <button id="nextDay">›</button>
              </div>
            </div>
            <div class="info-item">
              <span>总时长</span>
              <span id="dailyTotalDuration">2h 37m 19s</span>
            </div>
            <div class="info-item">
              <span>网站</span>
              <span id="dailyWebsiteCount">16</span>
            </div>
          </div>
          <div class="chart-wrapper">
            <canvas id="dailyChart"></canvas>
          </div>
        </div>

        <div id="daily-website-list" class="website-list"> </div>
      </div>
    </div>

    <script
      src="./website-usage-time.js"
      type="module"
      defer
    ></script>
  </body>
</html>
