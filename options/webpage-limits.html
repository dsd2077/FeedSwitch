<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>网页限额管理</title>
    <link
      rel="stylesheet"
      href="webpage-limits.css"
    />
  </head>

  <body>
    <h2>网页限额</h2>

    <!-- 延迟生效提示区域 -->
    <div class="delay-warning info">
      <span class="warning-icon">ℹ️</span>
      <strong>重要提醒：</strong>为防止一时冲动解除限制，删除网站和增加当天使用时间的设置将于次日生效。
    </div>

    <button id="add-limit-btn">添加限额</button>

    <!-- 添加限额对话框 -->
    <div
      id="add-limit-modal"
      class="modal"
    >
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3>添加限额</h3>

        <!-- 新增隐藏字段在此 -->
        <input
          type="hidden"
          id="limit-id"
        />

        <!-- 网站输入区域 -->
        <div class="websites-container">
          <div class="input-group">
            <input
              type="text"
              id="website-input"
              placeholder="输入网站域名（如：bilibili.com）"
              autocomplete="off"
            />
            <!-- <button type="button" id="add-website-btn">+ 添加</button> -->
            <div
              id="suggestions"
              class="suggestions-container"
            ></div>
          </div>
          <!-- <label>网站：</label> -->
          <div class="added-websites"></div>
        </div>

        <!-- 时长输入 -->
        <div class="time-limit-section">
          <label>时间：</label>
          <div class="time-options">
            <input
              type="radio"
              id="daily-option"
              name="time-type"
              value="daily"
              checked
            />
            <label for="daily-option">每天</label>
            <input
              type="number"
              id="daily-limit"
              name="daily-limit"
              placeholder="0"
              min="1"
            />
            <span>分钟</span>
          </div>
          <div class="time-options">
            <input
              type="radio"
              id="custom-option"
              name="time-type"
              value="custom"
            />
            <label for="custom-option">自定义</label>
            <button
              type="button"
              id="custom-time-btn"
              disabled
              >编辑...</button
            >
          </div>
          <hr />
        </div>

        <!-- 模态窗口内的警告 -->
        <div
          class="delay-warning danger"
          id="modal-warning"
          style="display: none"
        >
          <span class="warning-icon">⚠️</span>
          <strong>注意：</strong>增加当天使用时间将于次日生效！
        </div>

        <!-- 按钮组 -->
        <div class="modal-action-buttons">
          <div class="left-buttons">
            <button
              id="delete-limit-btn"
              style="display: none"
              >移除限额</button
            >
          </div>
          <div class="right-buttons">
            <button id="save-limit-btn">保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 自定义时间设置对话框 -->
    <div
      id="custom-time-modal"
      class="modal"
    >
      <div class="modal-content">
        <span
          class="close"
          id="custom-time-close"
          >&times;</span
        >
        <h3>每日时间限额</h3>

        <div class="weekly-schedule">
          <div class="day-row">
            <label>星期日</label>
            <input
              type="number"
              id="sunday-limit"
              min="0"
              placeholder="0"
            />
            <span>分钟</span>
          </div>
          <div class="day-row">
            <label>星期一</label>
            <input
              type="number"
              id="monday-limit"
              min="0"
              placeholder="0"
            />
            <span>分钟</span>
          </div>
          <div class="day-row">
            <label>星期二</label>
            <input
              type="number"
              id="tuesday-limit"
              min="0"
              placeholder="0"
            />
            <span>分钟</span>
          </div>
          <div class="day-row">
            <label>星期三</label>
            <input
              type="number"
              id="wednesday-limit"
              min="0"
              placeholder="0"
            />
            <span>分钟</span>
          </div>
          <div class="day-row">
            <label>星期四</label>
            <input
              type="number"
              id="thursday-limit"
              min="0"
              placeholder="0"
            />
            <span>分钟</span>
          </div>
          <div class="day-row">
            <label>星期五</label>
            <input
              type="number"
              id="friday-limit"
              min="0"
              placeholder="0"
            />
            <span>分钟</span>
          </div>
          <div class="day-row">
            <label>星期六</label>
            <input
              type="number"
              id="saturday-limit"
              min="0"
              placeholder="0"
            />
            <span>分钟</span>
          </div>
        </div>

        <div class="modal-buttons">
          <button
            type="button"
            id="cancel-custom-time"
            >取消</button
          >
          <button
            type="button"
            id="save-custom-time"
            >完成</button
          >
        </div>
      </div>
    </div>

    <div
      id="limits-list"
      style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px"
    >
      <h3>已设置的限额</h3>
      <div id="limits-container"></div>
    </div>
    <script src="webpage-limits.js"></script>
  </body>
</html>
