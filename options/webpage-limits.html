<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="webpageLimitsTitle"></title>
    <link
      rel="stylesheet"
      href="webpage-limits.css"
    />
  </head>

  <body>
    <h2 data-i18n="webpageLimitsHeading"></h2>

    <!-- 延迟生效提示区域 -->
    <div class="delay-warning info">
      <span class="warning-icon">ℹ️</span>
      <strong data-i18n="importantReminder"></strong>
      <span data-i18n="delayWarningText"></span>
    </div>

    <button
      id="add-limit-btn"
      data-i18n="addLimitButton"
    ></button>

    <!-- 添加限额对话框 -->
    <div
      id="add-limit-modal"
      class="modal"
    >
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3 data-i18n="addLimitModalTitle"></h3>

        <!-- 新增隐藏字段在此 -->
        <input
          type="hidden"
          id="limit-id"
        />

        <!-- 网站输入区域 -->
        <div class="websites-container">
          <div class="input-group">
            <input
              type="text"
              id="website-input"
              data-i18n-placeholder="websiteInputPlaceholder"
              autocomplete="off"
            />
            <!-- <button type="button" id="add-website-btn">+ 添加</button> -->
            <div
              id="suggestions"
              class="suggestions-container"
            ></div>
          </div>
          <!-- <label>网站：</label> -->
          <div class="added-websites"></div>
        </div>

        <!-- 时长输入 -->
        <div class="time-limit-section">
          <label data-i18n="timeLabel"></label>
          <div class="time-options">
            <input
              type="radio"
              id="daily-option"
              name="time-type"
              value="daily"
              checked
            />
            <label
              for="daily-option"
              data-i18n="dailyOptionLabel"
            ></label>
            <input
              type="number"
              id="daily-limit"
              name="daily-limit"
              placeholder="0"
              min="1"
            />
            <span data-i18n="minutesUnit"></span>
          </div>
          <div class="time-options">
            <input
              type="radio"
              id="custom-option"
              name="time-type"
              value="custom"
            />
            <label
              for="custom-option"
              data-i18n="customOptionLabel"
            ></label>
            <button
              type="button"
              id="custom-time-btn"
              disabled
              data-i18n="editButton"
            ></button>
          </div>
          <hr />
        </div>

        <!-- 模态窗口内的警告 -->
        <div
          class="delay-warning danger"
          id="modal-warning"
          style="display: none"
        >
          <span class="warning-icon">⚠️</span>
          <strong data-i18n="noteLabel"></strong>
          <span data-i18n="modalWarningText"></span>
        </div>

        <!-- 按钮组 -->
        <div class="modal-action-buttons">
          <div class="left-buttons">
            <button
              id="delete-limit-btn"
              style="display: none"
              data-i18n="removeLimitButton"
            ></button>
          </div>
          <div class="right-buttons">
            <button
              id="save-limit-btn"
              data-i18n="saveButton"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <!-- 自定义时间设置对话框 -->
    <div
      id="custom-time-modal"
      class="modal"
    >
      <div class="modal-content">
        <span
          class="close"
          id="custom-time-close"
          >&times;</span
        >
        <h3 data-i18n="customTimeModalTitle"></h3>

        <div class="weekly-schedule">
          <div class="day-row">
            <label data-i18n="weekdaySunday"></label>
            <input
              type="number"
              id="sunday-limit"
              min="0"
              placeholder="0"
            />
            <span data-i18n="minutesUnit"></span>
          </div>
          <div class="day-row">
            <label data-i18n="weekdayMonday"></label>
            <input
              type="number"
              id="monday-limit"
              min="0"
              placeholder="0"
            />
            <span data-i18n="minutesUnit"></span>
          </div>
          <div class="day-row">
            <label data-i18n="weekdayTuesday"></label>
            <input
              type="number"
              id="tuesday-limit"
              min="0"
              placeholder="0"
            />
            <span data-i18n="minutesUnit"></span>
          </div>
          <div class="day-row">
            <label data-i18n="weekdayWednesday"></label>
            <input
              type="number"
              id="wednesday-limit"
              min="0"
              placeholder="0"
            />
            <span data-i18n="minutesUnit"></span>
          </div>
          <div class="day-row">
            <label data-i18n="weekdayThursday"></label>
            <input
              type="number"
              id="thursday-limit"
              min="0"
              placeholder="0"
            />
            <span data-i18n="minutesUnit"></span>
          </div>
          <div class="day-row">
            <label data-i18n="weekdayFriday"></label>
            <input
              type="number"
              id="friday-limit"
              min="0"
              placeholder="0"
            />
            <span data-i18n="minutesUnit"></span>
          </div>
          <div class="day-row">
            <label data-i18n="weekdaySaturday"></label>
            <input
              type="number"
              id="saturday-limit"
              min="0"
              placeholder="0"
            />
            <span data-i18n="minutesUnit"></span>
          </div>
        </div>

        <div class="modal-buttons">
          <button
            type="button"
            id="cancel-custom-time"
            data-i18n="cancelButton"
          ></button>
          <button
            type="button"
            id="save-custom-time"
            data-i18n="doneButton"
          ></button>
        </div>
      </div>
    </div>

    <div
      id="limits-list"
      style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px"
    >
      <h3 data-i18n="setLimitsHeading"></h3>
      <div id="limits-container"></div>
    </div>
    <script src="webpage-limits.js"></script>
  </body>
</html>
