<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="popupTitle"></title>
    <link
      rel="stylesheet"
      type="text/css"
      href="popup.css"
    />
  </head>

  <body>
    <div class="toggle-container">
      <label class="switch">
        <input
          type="checkbox"
          id="tracking-switch"
          hidden
        />
        <div class="slider">
          <span
            class="on"
            data-i18n="focusLabel"
          ></span>
          <span
            class="off"
            data-i18n="funLabel"
          ></span>
          <div class="button"></div>
        </div>
      </label>
      <div class="shortcut-display" id="shortcut-display">
        <span class="shortcut-text" id="shortcut-text"></span>
      </div>
    </div>
    <div class="date-navigation">
      <button id="prevDay">‹</button>
      <span id="currentDate"></span>
      <button id="nextDay">›</button>
    </div>
    <input
      id="website-search"
      class="website-search"
      type="search"
      data-i18n-placeholder="searchPlaceholder"
      autocomplete="off"
    />
    <ul id="website-list"></ul>
    <button
      id="go-to-options"
      data-i18n="goToOptionsLabel"
    ></button>

    <script src="../scripts/i18n.js"></script>
    <script
      src="popup.js"
      type="module"
    ></script>
  </body>
</html>
