<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FeedBlock</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="popup.css"
    />
  </head>

  <body>
    <div class="toggle-container">
      <label class="switch">
        <input
          type="checkbox"
          id="tracking-switch"
          hidden
        />
        <div class="slider">
          <span class="on">专注</span>
          <span class="off">娱乐</span>
          <div class="button"></div>
        </div>
      </label>
    </div>
    <div class="date-navigation">
      <button id="prevDay">‹</button>
      <span id="currentDate"></span>
      <button id="nextDay">›</button>
    </div>
    <ul id="website-list"></ul>
    <button id="go-to-options">Go to options</button>

    <script
      src="popup.js"
      type="module"
    ></script>
  </body>
</html>
