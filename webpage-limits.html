<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>网页限额管理</title>
    <style>
      .modal {
        display: none;
        /* 默认隐藏 */
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
        max-width: 500px;
      }

      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }
      .input-group {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        position: relative; /* 新增 */
      }

      #website-input {
        flex: 1;
        padding: 8px;
      }

      .added-websites {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0;
      }

      .website-tag {
        background: #e0f0ff;
        border-radius: 4px;
        padding: 4px 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .remove-tag-btn {
        background: none;
        border: none;
        color: #666;
        cursor: pointer;
        padding: 0;
        font-size: 16px;
      }

      .remove-tag-btn:hover {
        color: #ff4444;
      }
      .limit-item {
        border: 1px solid #ddd;
        border-radius: 4px;
        margin: 5px 0;
        padding: 8px;
      }
      .suggestions-container {
        display: none; /* 初始隐藏 */
        position: absolute;
        top: 100%; /* 紧贴输入框下方 */
        left: 0;
        width: 100%;
        background: white;
        border: 1px solid #ddd;
        border-top: none;
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
      }
      .input-group.active .suggestions-container {
        display: block;
      }
      .suggestion-item {
        padding: 8px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .suggestion-item:hover,
      .suggestion-item.active {
        background: #f0f8ff;
      }
    </style>
  </head>

  <body>
    <h2>网页限额</h2>
    <button id="add-limit-btn">添加限额</button>

    <!-- 添加限额对话框 -->
    <div id="add-limit-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3>添加限额</h3>

        <!-- 新增隐藏字段在此 -->
        <input type="hidden" id="limit-id" />

        <!-- 网站输入区域 -->
        <div class="websites-container">
          <div class="input-group">
            <input type="text" id="website-input" placeholder="输入网站域名（如：example.com）" autocomplete="off" />
            <!-- <button type="button" id="add-website-btn">+ 添加</button> -->
            <div id="suggestions" class="suggestions-container"></div>
          </div>
          <!-- <label>网站：</label> -->
          <div class="added-websites"></div>
        </div>

        <!-- 时长输入 -->
        <label for="daily-limit">每日娱乐时长（分钟）:</label>
        <input type="number" id="daily-limit" name="daily-limit" /><br /><br />

        <button id="save-limit-btn">保存</button>
      </div>
    </div>

    <div id="limits-list" style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px">
      <h3>已设置的限额</h3>
      <div id="limits-container"></div>
    </div>
    <script src="webpage-limits.js"></script>
  </body>
</html>
